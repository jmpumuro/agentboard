<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>AgentBoard prototype</title>
<style>
:root{
  --bg:#f5f4ef;--panel:#ffffff;--ink:#1e1d1a;--muted:#6c6a63;--line:#e2dfd6;--dot:#c9c5b9;
  --accent:#2c5f52;--accent-soft:#e2efe9;--agent:#b5532a;--agent-soft:#f8e7df;--danger:#a23b3b;
  --yellow:#fbe8a0;--blue:#cfe1f6;--green:#cdebd5;--pink:#f8d3de;--purple:#e2d6f5;--white:#eeece6;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#191917;--panel:#232320;--ink:#eeece6;--muted:#a3a097;--line:#383732;--dot:#45443e;
  --accent:#7cc0ad;--accent-soft:#263a35;--agent:#e58a63;--agent-soft:#3d2a22;--danger:#e07a7a;
  --yellow:#6d5f1f;--blue:#274463;--green:#25503a;--pink:#6a3345;--purple:#463766;--white:#3a3934;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);display:flex;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.side{width:216px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 10px}
.brand{font-weight:700;font-size:17px;padding:4px 10px 16px}
.brand span{color:var(--agent)}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:var(--bg)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.me{display:flex;align-items:center;gap:8px;padding:10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.proto{font-size:11.5px;color:var(--muted);padding:8px 10px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--agent);color:#fff;display:grid;place-items:center;font-style:normal;font-size:15px;flex:none;margin-left:-4px}
.me .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.anon .side{display:none}
.anon .main{margin-left:0 !important}
.auth{max-width:380px;margin:6vh auto 0;padding:26px}
.auth h1{margin:14px 0 4px}
.auth .btn{width:100%;margin-top:14px;padding:10px}
.auth .alt{display:block;text-align:center;margin-top:14px;font-size:13.5px;color:var(--accent);background:none;border:0;width:100%}
input[type=password],input[type=email]{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;width:100%}
.reply.bad{color:var(--danger)}
@media (min-width:760px){
  /* Side nav: an icon rail that expands over the page on hover or keyboard focus. */
  .side{position:fixed;left:0;top:0;bottom:0;width:60px;z-index:15;overflow:hidden;transition:width .16s ease,box-shadow .16s ease}
  .side:hover,.side:focus-within{width:216px;box-shadow:8px 0 28px rgba(0,0,0,.14)}
  .main{margin-left:60px}
  .side .brand b,.side .nav a span,.side .me .nm{opacity:0;transition:opacity .12s ease;white-space:nowrap}
  .side:hover .brand b,.side:hover .nav a span,.side:hover .me .nm,.side:focus-within .brand b,.side:focus-within .nav a span,.side:focus-within .me .nm{opacity:1}
  .side .proto{display:none}
  .side:hover .proto,.side:focus-within .proto{display:block}
  .side .nav a{padding:9px 11px}
  .side .me{padding:10px 8px}
}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;position:relative}
.ctb{position:absolute;right:14px;bottom:14px;z-index:6;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted);box-shadow:0 2px 10px rgba(0,0,0,.1)}
.ctb:hover{color:var(--accent);border-color:var(--accent)}
.onboard .ctb{right:auto;left:12px;bottom:auto;top:62px}
@media (min-width:760px){.onboard .ctb{top:auto;bottom:14px}}
.view{flex:1;overflow:auto;padding:24px 28px 40px}
.view.flush{padding:0;display:flex;flex-direction:column;overflow:hidden}
h1{font-size:22px;margin:0}
.head{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-weight:500;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.agentb{background:var(--agent);border-color:var(--agent);color:#fff}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent);border:2px solid var(--panel);margin-left:-6px;flex:none}
.av:first-child{margin-left:0}
.av.agent{background:var(--agent-soft);color:var(--agent);border-radius:7px}
.av.live{box-shadow:0 0 0 2px var(--agent)}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.tag.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.off{color:var(--danger)}
.muted{color:var(--muted)}
/* boards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.bcard{overflow:hidden;cursor:pointer}
.bcard:hover{border-color:var(--accent)}
.thumb{height:104px;background:var(--bg);border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.thumb i{position:absolute;border-radius:2px}
.bmeta{padding:12px 14px;display:flex;align-items:center;gap:8px}
.bmeta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bmeta small{color:var(--muted)}
/* board */
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.cv{flex:1;min-width:0;position:relative;display:flex}
.dockwrap{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:8;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:calc(100% - 10px);pointer-events:none}
.dockwrap > *{pointer-events:auto}
.dockwrap.flip{flex-direction:column-reverse}
.dock{display:flex;gap:2px;align-items:center;background:var(--ink);color:var(--bg);border-radius:16px;padding:6px 6px 6px 2px;box-shadow:0 8px 24px rgba(0,0,0,.28);max-width:100%}
.grip{width:18px;height:40px;display:grid;place-items:center;cursor:grab;touch-action:none;flex:none;opacity:.55;border-radius:8px}
.grip:hover{opacity:1}
.grip:active{cursor:grabbing}
.dock.ask{width:580px}
.dock.ask input{flex:1;min-width:0;height:40px;border:0;border-radius:11px;padding:0 12px;background:color-mix(in srgb,var(--bg) 16%,transparent);color:inherit;outline:none;font-size:15px}
.dock.ask input::placeholder{color:color-mix(in srgb,var(--bg) 60%,transparent)}
.dock.ask input:focus{box-shadow:0 0 0 2px color-mix(in srgb,var(--bg) 45%,transparent)}
.dock.ask select{height:40px;max-width:118px;border:0;border-radius:11px;background:color-mix(in srgb,var(--bg) 16%,transparent);color:inherit;padding:0 6px;font-weight:600;font-size:13.5px;flex:none}
.dock.ask select option{color:var(--ink);background:var(--panel)}
.dock .send{width:auto;padding:0 14px;background:var(--agent);color:#fff;font-weight:600;font-size:14.5px}
.dock .noag{padding:0 10px;font-size:13.5px}
.dock .noag a{color:inherit}
.resp{width:520px;max-width:100%;max-height:min(46vh,400px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.2);padding:10px 12px;font-size:14px}
.resp:empty{display:none}
.resp .rhd{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.resp .rhd .btn{padding:2px 8px}
.resp .q{color:var(--muted);font-size:13px;margin-bottom:6px;overflow-wrap:anywhere}
.resp .cap{font-size:12.5px;color:var(--muted)}
.resp .chips{padding:0;margin-top:8px;flex-wrap:wrap;overflow:visible}
.lnk{border:0;background:none;padding:2px 0;color:var(--accent);font-size:13px;text-decoration:underline}
.back{display:inline-flex;align-items:center;gap:4px;min-width:40px;height:34px;padding:0 10px 0 6px;justify-content:center;flex:none}
.back svg{width:18px;height:18px}
.barx{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.dock button{width:40px;height:40px;border:0;background:none;color:inherit;border-radius:11px;display:grid;place-items:center;flex:none;padding:0}
.dock button svg{width:21px;height:21px}
.dock button.on{background:color-mix(in srgb,var(--bg) 24%,transparent)}
.dock .sep{width:1px;height:24px;background:color-mix(in srgb,var(--bg) 30%,transparent);margin:0 3px;flex:none}
.dock .ag{width:auto;padding:0 12px;font-weight:600;font-size:14.5px}
.zoomc{position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;z-index:7;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.zoomc .btn{border-color:transparent;background:none;padding:4px 8px}
.zoomc .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
.zoomc .zl{font-size:13px;font-weight:600;min-width:44px;text-align:center}
.bar .title{font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;padding:4px 6px;border-radius:6px;text-align:left}
.bar .title:hover{background:var(--bg)}
.bar input.title{border:1px solid var(--accent);background:var(--panel);min-width:0}
.stage{flex:1;display:flex;min-height:0;position:relative}
.vp{flex:1;min-width:0;overflow:hidden;position:relative;touch-action:none;cursor:default;background-color:var(--bg);background-image:radial-gradient(circle,var(--dot) 1.2px,transparent 1.6px);background-size:24px 24px}
.vp.placing{cursor:crosshair}
.vp.hand{cursor:grab}
.surface{position:absolute;left:0;top:0;transform-origin:0 0}
.el{position:absolute;user-select:none;-webkit-user-select:none;outline:2px solid transparent;outline-offset:2px}
.el.sel{outline-color:var(--accent)}
.el .txt{white-space:pre-wrap;overflow-wrap:anywhere;outline:none}
.el.editing .txt{user-select:text;-webkit-user-select:text;cursor:text}
.el.note,.el.shape{display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 12px;font-size:14.5px;cursor:pointer}
.el.note{border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.el.shape .bg{position:absolute;inset:0;z-index:0}
.el.shape .txt,.el.note .txt{position:relative;z-index:1;width:100%}
.k-rect{border-radius:2px}.k-rounded{border-radius:16px}.k-ellipse{border-radius:50%}.k-diamond{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.el.drawing{cursor:pointer;color:var(--ink)}
.pin{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--agent);box-shadow:0 0 0 5px color-mix(in srgb,var(--agent) 28%,transparent);pointer-events:none;transform:scale(var(--inv,1))}
.el.scene3d{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.12);cursor:pointer}
.c3dw{flex:1;min-height:0;position:relative}
.c3d{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.cap3{flex:none;height:42px;padding:5px 10px;font-size:12px;line-height:1.3;color:var(--muted);border-top:1px solid var(--line);overflow:hidden}
.cap3 b{color:var(--ink)}
.rng{display:flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap;margin:0;font-weight:600}
.rng input{width:90px}
.pn{font-size:13px;white-space:nowrap;padding:0 4px}
.selbar .sw6{cursor:pointer}
.el.embed{cursor:pointer;border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.etitle{height:26px;line-height:26px;padding:0 10px;font-size:12px;font-weight:600;color:var(--muted);background:var(--panel);border-bottom:1px solid var(--line);border-radius:7px 7px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eframe{position:absolute;border:0;background:#fff;pointer-events:none;border-radius:0 0 7px 7px}
.ink{width:100%;height:100%;display:block;overflow:visible;pointer-events:none}
.ink polyline,#inkp polyline{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
#inkp{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;color:var(--ink)}
.vp.pen{cursor:crosshair}
.el.text{cursor:pointer;max-width:900px;width:max-content;line-height:1.25}
.s-small{font-size:13px}.s-body{font-size:16px}.s-large{font-size:26px;font-weight:600}.s-title{font-size:40px;font-weight:700}
.mark{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:6px;background:var(--agent);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;z-index:2}
.rh{position:absolute;right:-9px;bottom:-9px;width:18px;height:18px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);cursor:nwse-resize;pointer-events:auto;z-index:3}
.rh{transform:scale(var(--inv,1));transform-origin:center}
@media (pointer:coarse){.rh{width:26px;height:26px;right:-13px;bottom:-13px}}
.c-yellow{background:var(--yellow)}.c-blue{background:var(--blue)}.c-green{background:var(--green)}.c-pink{background:var(--pink)}.c-purple{background:var(--purple)}.c-white{background:var(--white)}
svg.arrows{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.arw .ln{stroke:var(--ink);stroke-width:2}
.arw .hit{stroke:transparent;stroke-width:18;pointer-events:stroke;cursor:pointer}
.arw.sel .ln{stroke:var(--accent);stroke-width:3.5}
.arw text{font-size:12.5px;fill:var(--ink);stroke:var(--bg);stroke-width:5px;paint-order:stroke;text-anchor:middle}
.claim{position:absolute;border:2px dashed var(--agent);border-radius:12px;background:color-mix(in srgb,var(--agent-soft) 55%,transparent);pointer-events:none}
.claim span{position:absolute;top:-24px;left:0;background:var(--agent);color:#fff;font-size:12px;padding:2px 8px;border-radius:6px;white-space:nowrap}
.selbar{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px;display:flex;gap:6px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.14);z-index:7;max-width:calc(100% - 16px);overflow-x:auto}
.selbar:empty{display:none}
.selbar.top{bottom:auto;top:58px}
.sw6{width:22px;height:22px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);flex:none;padding:0}
.selbar select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 6px;font-size:13px}
.msg.u{align-self:flex-end;background:var(--accent-soft);padding:7px 11px;border-radius:12px 12px 3px 12px;max-width:88%}
.msg.a{font-size:14px}
.stp{display:flex;gap:7px;align-items:baseline;font-size:12.5px;padding:2px 0;color:var(--muted)}
.stp .st{flex:none;width:12px;text-align:center;font-weight:700}
.stp.done .st{color:var(--accent)}.stp.failed .st,.stp.failed b{color:var(--danger)}
.stp .k{font:700 10px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;padding:0 5px;border-radius:5px;border:1px solid var(--line);background:var(--bg);flex:none;width:54px;text-align:center}
.stp .k.mcp{color:var(--accent)}.stp .k.rag{color:var(--agent)}
.stp b{color:var(--ink);font-weight:600}
.reply{white-space:pre-wrap;margin-top:6px;overflow-wrap:anywhere}
.chips{display:flex;gap:6px}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 10px;font-size:12.5px}
.dock .ag{background:var(--agent);color:#fff}
.panel{width:300px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px}
.panel.hide{display:none}
.pclose{display:none;float:right}
@media (max-width:759px){.pclose{display:block}}
.panel h3{margin:0 0 6px;font-size:14px}
.ev{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.ev:last-child{border:0}
.ev small{color:var(--muted);display:block}
.call{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;display:flex;gap:6px;padding:3px 0;border-bottom:1px dashed var(--line)}
.call b{flex:none}
.call .okc{color:var(--accent)}.call .bad{color:var(--danger)}
.call span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* tables, docs, forms */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
code,pre,textarea.mono{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
code{background:var(--bg);padding:1px 5px;border-radius:5px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto;margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.sect{padding:18px 20px;margin-bottom:16px}
.sect h2{font-size:16px;margin:0 0 4px}
.sect p{margin:0;color:var(--muted)}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0;padding-bottom:0}
.sw{width:40px;height:23px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked=true]{background:var(--accent)}
.sw[aria-checked=true]::after{left:20px}
input[type=text],select.f,textarea{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:120px;resize:vertical}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
.cgrid{display:grid;grid-template-columns:1fr 110px;gap:10px}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--panel);border-radius:14px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto}
.modal h2{margin:0 0 4px;font-size:18px}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.warn{background:var(--agent-soft);color:var(--agent);padding:8px 10px;border-radius:8px;font-size:13px;margin-top:10px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:12px;font-size:13.5px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1}
.toast.act.show{pointer-events:auto}
.tact{margin-left:12px;background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:0}
.empty{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);max-width:300px;pointer-events:none;font-size:15px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.hide{display:none !important}
.marq{position:absolute;border:1.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);pointer-events:none;z-index:6;border-radius:3px}
.racts{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.ev small a{color:inherit}
.me{cursor:pointer}
.dock button em{display:none}
@media (min-width:760px){
  .dock button[data-tool]{width:54px;height:50px;align-content:center;gap:1px}
  .dock button em{display:block;font-style:normal;font-size:10px;line-height:1.1;opacity:.85}
}
@media (max-width:759px){
  .dock:not(.ask) button[data-tool]{width:28px}
  .dock .ag{padding:0 9px}

  var el = $("resp"); if (!el) return;
  var runs = db.runs.filter(function(r){ return r.boardId === ui.boardId; }), latest = runs[runs.length - 1], html = "";
  var MARK = {running:"…", done:"✓", failed:"✕", skipped:"–"};
  var hidden = !latest || (prefs.hidden[ui.boardId] === latest.id && ui.respIdx == null);
  if (!hidden){
    var i = ui.respIdx == null ? runs.length - 1 : Math.max(0, Math.min(runs.length - 1, ui.respIdx)), r = runs[i];
    var ag = db.agents.filter(function(a){ return a.id === r.agentId; })[0] || {name:"Agent"}, live = r.status === "running" || r.status === "queued", open = live || ui.stepsOpen;
    html = '<div class="rhd">' + av({kind:"agent", name:ag.name}, live) + '<b>' + esc(ag.name) + '</b><span class="muted" style="font-size:13px">' + {queued:"queued", running:"working…", done:"", failed:"could not finish", cancelled:"stopped"}[r.status] + '</span><span class="grow"></span>' +
      (runs.length > 1 ? '<button class="btn sm" data-nav="-1"' + (i === 0 ? " disabled" : "") + ' aria-label="Earlier response">‹</button><span class="muted" style="font-size:12.5px">' + (i + 1) + ' / ' + runs.length + '</span><button class="btn sm" data-nav="1"' + (i === runs.length - 1 ? " disabled" : "") + ' aria-label="Later response">›</button>' : "") +
      '<button class="btn sm" data-hide aria-label="Hide this response" title="Hide">✕</button></div>' +
      '<div class="q">You asked: ' + esc(r.message) + '</div>' +
      (open ? r.steps.map(function(s){ return '<div class="stp ' + s.status + '"><span class="st">' + MARK[s.status] + '</span><span class="k ' + s.kind + '">' + s.kind.toUpperCase() + '</span><span><b>' + esc(s.name) + '</b>' + (s.note ? " · " + esc(s.note) : "") + '</span></div>'; }).join("") : "") +
      (!live && r.steps.length ? '<button class="lnk" data-steps>' + (ui.stepsOpen ? "Hide the steps" : "Show the " + r.steps.length + " steps it took") + '</button>' : "") +
      (r.reply ? '<div class="reply">' + esc(r.reply) + '</div>' : "") + (r.error ? '<div class="reply bad">I could not finish. ' + esc(r.error.message) + '</div>' : "") + (r.status === "cancelled" ? '<div class="reply muted">Stopped before finishing.</div>' : "") +
      (r.batches && r.batches.length && !live ? '<div class="racts"><button class="btn sm" data-show="' + r.id + '">Show on board</button>' + (r.reverted ? '<span class="muted" style="font-size:13px">Changes undone</span>' : '<button class="btn sm" data-revert="' + r.id + '">Undo changes</button>') + '</div>' : "");
  } else if (ui.mode === "ask" && boardAgents().length){
    var cur2 = db.agents.filter(function(a){ return a.id === chat.agentId; })[0] || boardAgents()[0];
    html = '<div class="cap" id="ccap">' + esc(capsLine(cur2)) + '</div><div class="chips">' + ["Build a 3D model of an engine", "Mock up a pricing page", "Draw a rocket", "Brainstorm 4 ideas about onboarding", "What questions are we missing about pricing?", "Propose next steps", "Summarize the board", "Tidy the layout"].map(function(t){ return '<button class="chip">' + t + '</button>'; }).join("") + '</div>' +
      (latest ? '<button class="lnk" data-last style="margin-top:6px">Show the last response</button>' : "");
  }
  el.innerHTML = html;
  if (!hidden && (runs[runs.length - 1].status === "running")) el.scrollTop = el.scrollHeight;
  el.onclick = function(ev){
    var t = ev.target, nav = t.closest("[data-nav]"), sh = t.closest("[data-show]"), rv = t.closest("[data-revert]"), chip = t.closest(".chip");
    if (nav){ var n = (ui.respIdx == null ? runs.length - 1 : ui.respIdx) + parseInt(nav.dataset.nav, 10); ui.respIdx = n >= runs.length - 1 ? null : Math.max(0, n); ui.stepsOpen = false; drawResp(); }
    else if (t.closest("[data-hide]")){ prefs.hidden[ui.boardId] = latest.id; ui.respIdx = null; savePrefs(); drawResp(); drawSurface(); }
    else if (t.closest("[data-steps]")){ ui.stepsOpen = !ui.stepsOpen; drawResp(); }
    else if (t.closest("[data-last]")){ delete prefs.hidden[ui.boardId]; savePrefs(); drawResp(); }
    else if (chip) sendAsk(chip.textContent);
    else if (sh) focusOn(findRun(sh.dataset.show).touched || []);
    else if (rv){ var r2 = sess("POST", "/runs/" + rv.dataset.revert + "/revert"); toast(r2.status === 200 ? "The agent's changes were undone" : r2.body.error.message); refresh(); }
  };
  var b = $("csend"); if (b) b.textContent = activeRun(ui.boardId) ? "Stop" : "Send";
  placeDock();
}

    '<div class="row"><div class="grow"><b>Require a claim before an agent writes</b><div class="muted">On: a write outside the agent\'s own claim is refused with claim_required.</div></div><button class="sw" role="switch" aria-checked="' + s.requireClaimBeforeAgentWrite + '" data-k="requireClaimBeforeAgentWrite" aria-label="Require a claim before agent writes"></button></div></div>' +
    '<div class="card sect"><h2>Knowledge</h2><p>Documents that agents with the knowledge capability can search (RAG). In this prototype the search is keyword matching, not embeddings.</p>' +
    sess("GET", "/knowledge").body.items.map(function(d){ return '<div class="row"><div class="grow"><b>' + esc(d.title) + '</b><div class="muted" style="font-size:13px">' + esc(d.text.slice(0, 110)) + (d.text.length > 110 ? "…" : "") + '</div></div><button class="btn sm danger" data-kd="' + d.id + '">Remove</button></div>'; }).join("") +
    '<label for="kt">Add a document</label><input type="text" id="kt" maxlength="120" placeholder="Title"><textarea id="kx" style="min-height:80px;margin-top:8px" placeholder="Paste text the agents may draw on"></textarea><div class="acts" style="justify-content:flex-start;margin-top:10px"><button class="btn" id="ka">Add document</button></div></div>' +
    '<div class="card sect"><h2>Account</h2><div class="row">' + av(ME) + '<div class="grow"><b>' + esc(db.user.name) + '</b><div class="muted">' + esc(db.user.email) + '</div></div><button class="btn" id="so">Sign out</button></div></div>' +
    '<div class="card sect"><h2>Prototype data</h2><p>Boards, agents and settings are kept in this browser where storage is allowed.</p><div class="acts" style="justify-content:flex-start"><button class="btn danger" id="rs">Reset demo data</button></div></div>';
  $("wn").onchange = function(){ var r = sess("PATCH", "/settings", {name:$("wn").value}); toast(r.status === 200 ? "Saved" : r.body.error.message); };
  v.querySelectorAll(".sw").forEach(function(el){ el.onclick = function(){ var d = {}; d[el.dataset.k] = el.getAttribute("aria-checked") !== "true"; var r = sess("PATCH", "/settings", d); el.setAttribute("aria-checked", r.body[el.dataset.k]); toast("Saved"); }; });
  $("so").onclick = function(){ api("session", "POST", "/auth/logout"); save(); ui.mode = "tools"; route(); };
  $("ka").onclick = function(){ var r = sess("POST", "/knowledge", {title:$("kt").value, text:$("kx").value}); if (r.status !== 201){ toast(r.body.error.message); return; } toast("Document added"); vSettings(v); };
  v.querySelectorAll("[data-kd]").forEach(function(el){ el.onclick = function(){ sess("DELETE", "/knowledge/" + el.dataset.kd); toast("Document removed"); vSettings(v); }; });
  $("rs").onclick = function(){ confirmM("Reset demo data?", "All boards, agents and settings in this prototype go back to the starting state.", "Reset", function(){ calls = []; chat.agentId = null; ui.undo = []; ui.redo = []; ui.boardId = null; seed(); toast("Demo data reset"); vSettings(v); }); };
}

ui.path = hashPath() || "boards";
$("ctb").onclick = contractModal;
route();
</script>
</body>
</html>
