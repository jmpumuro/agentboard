services:
  api:
    build: .
    ports: ["4173:4173"]
    environment:
      DATABASE_URL: postgresql://agentboard:agentboard-local@postgres:5432/agentboard
      WEB_ORIGIN: http://localhost:4173
      HOST: 0.0.0.0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agentboard
      POSTGRES_PASSWORD: agentboard-local
      POSTGRES_DB: agentboard
    ports: ["55440:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentboard"]
      interval: 3s
      retries: 20
volumes:
  postgres:
